name: Build Android APK 

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Decode the Keystore file into the app folder
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks

      # 1. Automate AES-256 Encryption of Python Script
      - name: Encrypt Python Asset to Binary
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in app/src/main/assets/youtube_automator.py \
            -out app/src/main/assets/youtube_automator.bin \
            -k "UploaderX_Secret_Key_2026"
          rm -f app/src/main/assets/youtube_automator.py

      # 2. Automate Minification & Obfuscation of index.html
      - name: Minify and Obfuscate HTML & JavaScript
        run: |
          npx html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            --minify-css true \
            --minify-js true \
            -o app/src/main/assets/index.html \
            app/src/main/assets/index.html

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
          arguments: app:assembleRelease
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Upload the signed RELEASE APK
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hfm-Release.apk
          path: app/build/outputs/apk/release/app-release.apk